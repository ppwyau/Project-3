<!DOCTYPE html>
<html lang="en"> 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>UK Accident Visualization</title>
    <style>
        .fixed-filters {
            position: fixed;
            top: 120px;
            left: 30px;
            width: 250px;
            z-index: 999;
        }

        iframe {
            width: 100%;
            height: 500px;
            border: none;
            margin-top: 20px;
        }
    </style>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7"
        crossorigin="anonymous">

</head>

<body>
    <div class="container-fluid">

        <div class="row">
            <div class="p-3 text-center bg-info-subtle border border-dark">
                <h1>UK Accidents Visualization for 2021</h1>
                <p>Use the filters to interact with the graph</p>
            </div>
        </div>

        <br>

        <div class="row">
            <div class="col-md-3">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Filters</h5>
                        <label>Month:</label>
                        <select id="month">
                            <option>All</option><option>January</option><option>February</option><option>March</option><option>April</option>
                            <option>May</option><option>June</option><option>July</option><option>August</option>
                            <option>September</option><option>October</option><option>November</option><option>December</option>
                        </select>
                    
                        <label>Severity:</label>
                        <select id="severity">
                            <option>All</option><option>Fatal</option><option>Serious</option><option>Slight</option>
                        </select>
                    
                        <label>Weather:</label>
                        <select id="weather">
                            <option>All</option><option>Fine no high winds</option><option>Raining no high winds</option>
                            <option>Snowing no high winds</option><option>Fine + high winds</option><option>Raining + high winds</option>
                        </select>
                    
                        <label>Light:</label>
                        <select id="light">
                            <option>All</option><option>Daylight</option><option>Darkness - lights lit</option><option>Darkness - lights unlit</option>
                        </select>
                    
                        <label>Road Surface:</label>
                        <select id="surface">
                            <option>All</option><option>Dry</option><option>Wet/Damp</option><option>Snow</option><option>Frost/Ice</option>
                        </select>
                    
                        <label>Area:</label>
                        <select id="area">
                            <option>All</option><option>Urban</option><option>Rural</option>
                        </select>
                        
                        <label>Police Force</label>
                        <select id="police_force">
                            <option>All</option><option>Metropolitan Police</option><option>City of London</option><option>Cumbria</option><option>Lancashire</option><option>Merseyside</option><option>Greater Manchester</option><option>Cheshire</option><option>Northumbria</option><option>Durham</option><option>North Yorkshire</option><option>West Yorkshire</option><option>South Yorkshire</option><option>Humberside</option><option>Cleveland</option><option>West Midlands</option><option>Staffordshire</option><option>West Mercia</option><option>Warwickshire</option><option>Derbyshire</option><option>Nottinghamshire</option><option>Lincolnshire</option><option>Leicestershire</option><option>Northamptonshire</option><option>Cambridgeshire</option><option>Norfolk</option><option>Suffolk</option><option>Bedfordshire</option>
                        </select>

                        <label>Speed Limit</label>
                        <select id="speed_limit">
                            <option>All</option><option>20</option><option>30</option><option>40</option><option>50</option><option>60</option><option>70</option>
                        </select>



                        <button type="button" class="btn btn-primary" onclick="updatePlot()">Generate Graph </button>
                    </div>
                </div>
            </div>

            <div class="col-md-9">
                <iframe id="plot-frame" src="/plot"></iframe>

                <script>
                    function updatePlot() {
                        const filters = [
                            "month", "severity", "weather", "light", "surface", "area", "police_force", "speed_limit"
                        ];
                        let query = filters.map(id => {
                            const val = document.getElementById(id).value;
                            return `${id}=${encodeURIComponent(val)}`;
                        }).join("&");

                        const url = `/plot?${query}&t=${Date.now()}`;
                        document.getElementById("plot-frame").src = url;
                    }
                </script>
            </div>

        </div>
    </div> 

</body>
